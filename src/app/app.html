<a class="skip" href="#main" (click)="skip($event)">Skip to content</a>

<app-boot />
<div class="grid-glow" #gridGlow aria-hidden="true"></div>
<div class="cursor-glow" #cursorGlow aria-hidden="true"></div>

<app-topbar />

<main id="main" tabindex="-1" #main>
  <router-outlet />
</main>

<app-footer />

@if (showFab()) {
  <app-assistant-fab />
}
<app-command-palette />
<app-to-top />

<div class="toast" [class.show]="toast.visible()" role="status" aria-live="polite">{{ toast.message() }}</div>
