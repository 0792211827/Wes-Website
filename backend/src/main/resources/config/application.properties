# =====================================================================
# Extra settings for uploads and visitor analytics.
# (Spring Boot reads config/application.properties in addition to the main
#  application.properties, so the main file does not need to change.)
# =====================================================================

# Profile photo (5 MB) and CV (10 MB) uploads from the admin
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# Visitor Workspace
# Keep visitor events for this many days (a daily job removes older ones)
app.analytics.retention-days=${ANALYTICS_RETENTION_DAYS:365}
# Look up the visitor's approximate location from the IP (https://ipwho.is, free, no key)
app.analytics.geo-lookup=${ANALYTICS_GEO_LOOKUP:true}
# Days in the dashboard are counted in this time zone
app.analytics.timezone=${ANALYTICS_TIMEZONE:Africa/Nairobi}
