# =====================================================================
# LOCAL profile: runs with an in-memory H2 database, no PostgreSQL needed.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Data is reset at every restart (the starter content is seeded again).
# =====================================================================
spring.datasource.url=jdbc:h2:mem:wesportfolio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
