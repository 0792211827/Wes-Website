# =====================================================================
# WesPortfolio API  (Wesley Nyamosi — AI Engineering & Consulting)
# Every ${NAME:default} can be overridden with an environment variable,
# so passwords never have to be committed to Git.
# Local secrets can go in src/main/resources/secrets.properties or ./secrets.properties
# (see secrets.properties). Both are ignored by Git.
# =====================================================================
spring.application.name=WesPortfolio
spring.config.import=optional:classpath:secrets.properties,optional:file:./secrets.properties
server.port=${PORT:8087}

# ---------------------------------------------------------------------
# Database: PostgreSQL (Render or local)
# Render gives DATABASE_URL as postgres://user:pass@host:5432/db. The app
# converts it to JDBC automatically at start-up (see WesPortfolioApplication),
# or you can set SPRING_DATASOURCE_URL / DB_URL yourself in JDBC form.
# ---------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/WesPortfolio}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Langat001}}

# Small pool: Render's free/starter Postgres allows few connections
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate (tables are created and updated automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Behind Render's proxy: trust X-Forwarded-* so client IPs and https are correct
server.forward-headers-strategy=framework
server.compression.enabled=true

# Friendly JSON error bodies
spring.mvc.problemdetails.enabled=true

# Only the health endpoint is public
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Email is optional, so it must not mark the app as unhealthy
management.health.mail.enabled=false

# ---------------------------------------------------------------------
# Email (leave MAIL_HOST empty to switch email off; leads are still saved)
# Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_PASSWORD = an App Password
# ---------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=9000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000

# ---------------------------------------------------------------------
# Portfolio settings (app.*)
# ---------------------------------------------------------------------
# Admin login for the dashboard. CHANGE THE PASSWORD before going live.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:weslynyamosi}

# Secret that signs admin tokens (32+ random characters). Empty = random per start.
app.security.token-secret=${TOKEN_SECRET:}
app.security.token-hours=12
# Salt for hashing visitor IPs in the Ask-AI log (raw IPs are never stored)
app.security.ip-salt=${IP_SALT:wes-portfolio}

# Websites allowed to call the API from a browser (comma separated, * patterns allowed)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://wesleynyamosi.com,https://www.wesleynyamosi.com,https://*.vercel.app}

# Contact form emails
app.mail.notify-to=${NOTIFY_EMAIL:hello@wesleynyamosi.com}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.send-acknowledgement=${MAIL_ACK:true}

# GitHub (token optional: raises the limit from 60 to 5,000 calls/hour)
app.github.username=${GITHUB_USERNAME:wesleynyamosi}
app.github.token=${GITHUB_TOKEN:}
app.github.cache-minutes=30

# Ask Wesley's AI. Without AI_API_KEY it answers extractively from the knowledge base.
# Any OpenAI-compatible endpoint works (Groq, OpenAI, Together, a self-hosted vLLM server...).
app.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
app.ai.model=${AI_MODEL:llama-3.3-70b-versatile}
app.ai.api-key=${AI_API_KEY:}
app.ai.timeout-seconds=20
app.ai.min-score=0.5

# Rate limits (per visitor IP)
app.limits.ask-per-hour=15
app.limits.contact-per-hour=5
